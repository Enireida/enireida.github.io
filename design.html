<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="App and website design by Enireida Reci.">
<meta name="theme-color" content="#ffffff">
<title>Design, Enireida Reci</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light;--pea:#8FB339}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:#000;font:19px/1.55 "Times New Roman",Times,serif}
a{color:inherit;text-underline-offset:4px;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
a:focus-visible,button:focus-visible{outline:2px solid #000;outline-offset:4px}
::selection{background:var(--pea);color:#000}
/* the only colour on the page: name dot, main link, email */
.dot{color:var(--pea)}
.pea,.pea:hover{text-decoration-color:var(--pea);text-decoration-thickness:3px}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0;padding:0}
ul,ol{list-style:none}
h1,h2,h3{font-weight:400;line-height:1.1;letter-spacing:-.015em;text-wrap:balance}
.page{max-width:1120px;margin:0 auto;padding-inline:32px}

/* nav */
nav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 40px;padding-block:32px}
nav ul{display:flex;flex-wrap:wrap;gap:4px 26px}
nav a{text-decoration:none}
nav a:hover{text-decoration:underline}

/* one grid for the whole page: section title on the left, content on the right */
.row{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px 48px;padding-block:72px}
h2{font-size:30px}
.col{display:grid;grid-template-columns:minmax(0,1fr);gap:56px}
.col p,.col li{max-width:66ch}

/* intro */
.intro{padding-block:110px 90px}
h1{font-size:clamp(50px,8vw,104px);line-height:1;letter-spacing:-.035em}
.intro p{font-size:clamp(23px,2.5vw,30px);line-height:1.35;max-width:32em;margin-top:32px}
.links{display:flex;flex-wrap:wrap;gap:6px 28px;margin-top:30px}

/* items */
h3{font-size:28px;margin-bottom:8px}
.note{font-style:italic;margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:36px 48px}
.list{display:grid;gap:8px}
.bullets{list-style:disc;padding-left:1.1em;display:grid;gap:5px}

/* projects */
.projects{gap:110px}
.project h3{font-size:clamp(40px,5vw,60px);letter-spacing:-.03em}
.project > p{margin-bottom:20px}
.shots{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
.shots img{display:block;min-width:0;height:auto;border:1px solid #000}
.shots + .list{margin-top:30px}
.diagram{margin-top:34px}
.diagram img{display:block;height:auto}
details{margin-top:18px}
summary{display:inline-block;cursor:pointer;list-style:none;text-decoration:underline;text-decoration-color:var(--pea);text-decoration-thickness:3px;text-underline-offset:4px}
summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:2px solid #000;outline-offset:4px}
details[open] .open,details:not([open]) .close{display:none}
details .list{margin:24px 0 30px}
.diagram .note{margin:10px 0 0}
.tech{margin-top:20px;font-style:italic}

/* experience + skills */
.job{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 24px}
.col > .job{max-width:none}
.job > span{line-height:31px}
dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px 24px}
dt{font-style:italic}

/* contact */
.mail{font-size:clamp(24px,4vw,44px);line-height:1.15;letter-spacing:-.02em;overflow-wrap:anywhere}
button{font:inherit;color:inherit;background:none;border:0;padding:0;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;cursor:pointer}
button:hover{text-decoration-thickness:2px}
footer{padding-block:40px 48px}

@media (max-width:820px){
  .row{grid-template-columns:1fr;padding-block:48px}
  .projects{gap:80px}
}
@media (max-width:560px){
  body{font-size:18px}
  .page{padding-inline:20px}
  nav{padding-block:22px}
  nav ul{gap:4px 18px}
  .intro{padding-block:64px 48px}
  .two,.job,dl{grid-template-columns:1fr}
  dl{gap:0}
  dd + dt{margin-top:16px}
  .shots{gap:8px;margin-bottom:8px}
  .shots.wrap,details .shots{flex-direction:column}
  .shots.wrap img,details .shots img{flex:none!important;width:100%}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* design page */
.about{max-width:60ch;margin-bottom:24px}
.gallery{display:grid;gap:16px;justify-items:start}
.gallery.two{grid-template-columns:1fr 1fr}
.gallery img{display:block;max-width:100%;height:auto;border:1px solid #000}
@media (max-width:560px){.gallery.two{grid-template-columns:1fr}}
</style>
</head>
